# Minimal redis configuration for local development
bind 0.0.0.0
protected-mode yes

# Persistence: append only file (AOF) is a good compromise for durability
appendonly yes
appendfsync everysec

dir /data

# Snapshotting (RDB) still enabled as additional backup
save 900 1
save 300 10
save 60 10000

# SECURITY
# Uncomment and set a strong password for non-development environments
# requirepass your_strong_password

# Memory and eviction policy can be configured if needed
# maxmemory 1gb
# maxmemory-policy volatile-lru
